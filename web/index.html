<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>间序 Spaceflow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="logged-out">
    <div id="login"></div>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"><i></i><i></i><i></i><i></i></span>
          <div><strong>间序</strong><small>SPACEFLOW</small></div>
        </div>
        <div class="sidebar-label">WORKSPACE</div>
        <nav id="mainnav">
          <button data-page="explore" class="nav-item active">
            <span class="nav-icon" aria-hidden="true">◫</span> 空间发现</button
          ><button data-page="schedule" class="nav-item">
            <span class="nav-icon" aria-hidden="true">▦</span> 预订日程</button
          ><button data-page="mine" class="nav-item">
            <span class="nav-icon" aria-hidden="true">▤</span> 我的预订
          </button>
        </nav>
        <div class="sidebar-label admin-label admin-only">MANAGEMENT</div>
        <nav class="admin-only">
          <button data-page="rooms" class="nav-item">
            <span class="nav-icon" aria-hidden="true">▣</span> 会议室管理
          </button>
          <button data-page="users" class="nav-item">
            <span class="nav-icon" aria-hidden="true">♙</span> 账号与部门
          </button>
          <button data-page="reservations" class="nav-item">
            <span class="nav-icon" aria-hidden="true">▤</span> 预订管理
          </button>
          <button data-page="audit" class="nav-item">
            <span class="nav-icon" aria-hidden="true">≡</span> 操作记录
          </button>
          <button data-page="approvals" class="nav-item">
            <span class="nav-icon" aria-hidden="true">✓</span> 预订审批</button
          ><button data-page="editor" class="nav-item">
            <span class="nav-icon" aria-hidden="true">⌗</span>
            布局编辑器</button
          ><button data-page="settings" class="nav-item">
            <span class="nav-icon" aria-hidden="true">⚙</span> 预订规则
          </button>
        </nav>
        <div class="side-bottom">
          <div class="user-chip">
            <span class="avatar">间</span
            ><span><b id="userName"></b><small id="userRole"></small></span>
          </div>
          <button data-page="account" class="button wide">账号设置</button>
          <button id="logout" class="button wide">退出登录</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="breadcrumbs">
            <span>间序 / </span><b id="crumb">空间发现</b>
          </div>
          <div class="header-right">
            <button
              class="button small"
              data-page="notifications"
              id="notificationButton"
            >
              通知</button
            ><span class="header-date" id="todayText"></span
            ><button class="button small" id="refresh">刷新</button>
          </div>
        </header>
        <div id="content"></div>
      </main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="modal-backdrop" id="modal" aria-hidden="true">
        <div
          class="modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >
          <div class="modal-top">
            <div>
              <small class="eyebrow">NEW RESERVATION</small>
              <h2 id="modalTitle">预订会议室</h2>
            </div>
            <button class="icon-btn" id="closeModal" aria-label="关闭">
              ×
            </button>
          </div>
          <div id="modalBody"></div>
        </div>
      </div>
    </div>
    <script src="./management.js"></script>
    <script src="./features.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
