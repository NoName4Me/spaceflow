name: Verify Spaceflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: spaceflow
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure disposable test database
        run: |
          printf '%s\n' 'DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:5432/spaceflow' 'MIGRATION_DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:5432/spaceflow' > .env
      - run: npm run db:migrate && npm run db:seed
      - run: npm run typecheck && npm test && npm run test:prototype
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
