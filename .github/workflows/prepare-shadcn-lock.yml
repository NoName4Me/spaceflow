name: Prepare shadcn lock
on:
  push:
    branches: [feature/shadcn-foundation]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp package-lock.json /tmp/spaceflow-before.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Output lock delta
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const old=JSON.parse(fs.readFileSync("/tmp/spaceflow-before.json","utf8"));
          const next=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          for(const [k,v] of Object.entries(next.packages)){
            if(JSON.stringify(old.packages[k])!==JSON.stringify(v)) console.log("LOCK_ADD "+JSON.stringify([k,v]));
          }
          for(const k of Object.keys(old.packages)) if(!(k in next.packages)) console.log("LOCK_DELETE "+JSON.stringify(k));
          console.log("LOCK_COMPLETE "+Object.keys(next.packages).length);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
